[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "preference-optimization-reproduce"
version = "0.1.0"
description = "Reproducible DPO experiments"
requires-python = ">=3.10"
dependencies = [
  "accelerate>=0.34",
  "datasets>=2.20",
  "peft>=0.12",
  "pyyaml>=6.0",
  "torch>=2.2",
  "transformers>=4.45",
  "trl>=0.11",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
